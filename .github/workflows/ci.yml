name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt cfn-lint
      - name: Unit tests
        run: python -m pytest -q backend/tests
      - name: Lint CloudFormation
        run: cfn-lint infra/*.yml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Lambda image
        run: docker build -t mediascrape:ci backend
      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /bin/sh mediascrape:ci -c '
            set -e
            ffmpeg -version | head -1
            deno --version | head -1
            python -c "import app, yt_dlp, yt_dlp_ejs; print(\"yt-dlp\", yt_dlp.version.__version__)"
          '
