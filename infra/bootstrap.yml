AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  mediascrape one-time bootstrap: the ECR repository for the Lambda image and
  the IAM role GitHub Actions assumes (via OIDC, no stored AWS keys) to deploy.
  Created by scripts/bootstrap.sh; you should not need to touch it again.

Parameters:
  GitHubRepo:
    Type: String
    Default: marksuguitan/mediascrape
  DeployBranch:
    Type: String
    Default: main
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if this account already has the token.actions.githubusercontent.com provider.
  AppStackName:
    Type: String
    Default: mediascrape-app

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS no longer checks this for GitHub, but the field is still required.
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mediascrape
      ImageScanningConfiguration: { ScanOnPush: false }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep the last 3 images",
            "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":3},
            "action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mediascrape-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepo}:ref:refs/heads/${DeployBranch}"
                  - !Sub "repo:${GitHubRepo}:environment:production"
      Policies:
        - PolicyName: mediascrape-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              - Sid: CloudFormationRead
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStacks]
                Resource: "*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                Resource: !GetAtt Repository.Arn
              - Sid: Buckets
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:aws:s3:::${AppStackName}-*"
                  - !Sub "arn:aws:s3:::${AppStackName}-*/*"
              - Sid: Lambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:mediascrape-*"
              - Sid: LambdaRead
                Effect: Allow
                Action: [lambda:GetAccountSettings, lambda:ListFunctions]
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action: logs:*
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/mediascrape-*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: LambdaRole
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: "*"
              - Sid: Certificates
                Effect: Allow
                Action: [acm:DescribeCertificate, acm:ListCertificates]
                Resource: "*"
              - Sid: Dns
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZones
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
